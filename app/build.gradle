plugins {
    id 'com.android.application'
}

android {
    // namespace replaces the "package" attribute that used to live in AndroidManifest.xml
    namespace 'com.example.knportal'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.knportal"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Core AndroidX + Material Design components (TextInputLayout, MaterialButton, etc.)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
